<title>PECVD Background</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Single dark look: full-bleed WebGL canvas, optional demo hero on top */
:root{--bg:#07090c;--fg:#eef2f6;--muted:#8a96a3;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%)}
.hero{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));right:max(24px,env(safe-area-inset-right,0px));pointer-events:none}
.hero h1{font:600 clamp(40px,9vw,96px)/.9 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
.hero p{margin:8px 0 0;color:var(--muted);font:14px system-ui,sans-serif}
</style>
<canvas id="bg"></canvas>
<div class="vig"></div>
<div class="hero" id="hero"><h1>Edward Holt</h1><p>Chemical engineer · PhD researcher, University of Bath</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const cv=document.getElementById("bg");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090c);scene.fog=new THREE.Fog(0x07090c,14,30);
const cam=new THREE.PerspectiveCamera(35,1,.1,100);

// studio environment for realistic metal reflections
const env=new THREE.Scene();
const box=new THREE.Mesh(new THREE.BoxGeometry(20,20,20),new THREE.MeshBasicMaterial({color:0x0b0e12,side:THREE.BackSide}));env.add(box);
[[0,8,0,14,1,14,3],[9,2,0,1,8,10,1.6],[-9,3,2,1,6,6,.9],[0,2,-9,10,5,1,.5]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),new THREE.MeshBasicMaterial({color:new THREE.Color(a[6],a[6],a[6]*1.05)}));m.position.set(a[0],a[1],a[2]);env.add(m)});
const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(env,.04).texture;

const steel=new THREE.MeshStandardMaterial({color:0xb8c0c8,metalness:1,roughness:.28});
const brushed=new THREE.MeshStandardMaterial({color:0x9ea7b0,metalness:1,roughness:.45});
const graphite=new THREE.MeshStandardMaterial({color:0x22252a,metalness:.2,roughness:.7,emissive:0xff4a10,emissiveIntensity:0});
const ceramic=new THREE.MeshStandardMaterial({color:0xe9e4da,metalness:0,roughness:.6});
const copper=new THREE.MeshStandardMaterial({color:0xd08a4c,metalness:1,roughness:.3});
const glass=new THREE.MeshPhysicalMaterial({color:0xaee3ff,metalness:0,roughness:0,transmission:.9,transparent:true,opacity:.5});
const silicon=new THREE.MeshStandardMaterial({color:0x4a4f66,metalness:.7,roughness:.15});

const parts=[];const root=new THREE.Group();scene.add(root);
function part(mesh,explode,spin=0){const g=new THREE.Group();g.add(mesh);root.add(g);g.userData={home:g.position.clone(),ex:explode,spin,rot:(Math.random()-.5)*.6};parts.push(g);return g}
const cyl=(rt,rb,h,m,seg=64,open=false)=>{const x=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1,open),m);x.castShadow=x.receiveShadow=true;return x};

// chamber body (open tube with flanges)
const body=new THREE.Group();
const tube=cyl(2,2,2.6,steel,96,true);tube.material=steel.clone();tube.material.side=THREE.DoubleSide;body.add(tube);
[1.3,-1.3].forEach(y=>{const f=new THREE.Mesh(new THREE.TorusGeometry(2.05,.12,16,96),brushed);f.rotation.x=Math.PI/2;f.position.y=y;body.add(f)});
// viewport
const vp=cyl(.38,.38,.6,steel);vp.rotation.z=Math.PI/2;vp.position.set(2.2,.1,0);body.add(vp);
const win=cyl(.3,.3,.04,glass);win.rotation.z=Math.PI/2;win.position.set(2.52,.1,0);body.add(win);
// pump port
const pp=cyl(.45,.45,1.2,steel);pp.rotation.x=Math.PI/2;pp.position.set(0,-.6,2.4);body.add(pp);
const pf=new THREE.Mesh(new THREE.TorusGeometry(.5,.08,12,48),brushed);pf.position.set(0,-.6,3);body.add(pf);
part(body,new THREE.Vector3(0,0,0),.15);

const lid=part(cyl(2.25,2.25,.25,brushed),new THREE.Vector3(0,3.2,0),.6);lid.position.y=1.45;
const bolts=new THREE.Group();for(let i=0;i<16;i++){const b=cyl(.07,.07,.12,steel,12);const a=i/16*Math.PI*2;b.position.set(Math.cos(a)*2.05,.18,Math.sin(a)*2.05);bolts.add(b)}lid.add(bolts);
const gas=part(cyl(.12,.12,1.6,steel,24),new THREE.Vector3(0,5.6,0),1.2);gas.position.y=2.4;
const vcr=cyl(.2,.2,.25,brushed,6);vcr.position.y=.5;gas.children[0].add(vcr);

// showerhead with hole pattern
const shG=new THREE.Group();shG.add(cyl(1.6,1.6,.1,steel));
const holeM=new THREE.MeshBasicMaterial({color:0x050608});
for(let r=.2;r<1.5;r+=.22)for(let a=0;a<Math.PI*2;a+=.34/r){const h=new THREE.Mesh(new THREE.CircleGeometry(.035,8),holeM);h.rotation.x=Math.PI/2;h.position.set(Math.cos(a)*r,-.051,Math.sin(a)*r);shG.add(h)}
const sh=part(shG,new THREE.Vector3(0,2.1,0),-.5);sh.position.y=.85;

// substrate + heater + pedestal + thermocouple + feedthroughs + base
const sub=part(new THREE.Mesh(new THREE.BoxGeometry(1.1,.03,1.1),silicon),new THREE.Vector3(0,1.1,0),2);sub.position.y=-.38;
const heat=part(cyl(1.3,1.3,.22,graphite),new THREE.Vector3(0,-.6,0),-.8);heat.position.y=-.52;
const ped=part(cyl(.8,.95,.7,ceramic,48),new THREE.Vector3(0,-1.7,0),.4);ped.position.y=-.98;
const tc=part(cyl(.03,.03,1.6,copper,8),new THREE.Vector3(.8,-2.6,.4),2);tc.position.set(.3,-1.3,0);
const base=part(cyl(2.25,2.25,.25,brushed),new THREE.Vector3(0,-3.3,0),-.4);base.position.y=-1.45;
const ft=new THREE.Group();[-.5,.5].forEach(x=>{const f=cyl(.12,.12,.8,copper,16);f.position.x=x;ft.add(f);const c=cyl(.2,.2,.25,ceramic,24);c.position.set(x,.2,0);ft.add(c)});
const fth=part(ft,new THREE.Vector3(0,-4.6,0),.9);fth.position.y=-1.9;
parts.forEach(p=>p.userData.home=p.position.clone());

// plasma glow
const glowTex=(()=>{const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,"rgba(200,150,255,1)");g.addColorStop(.4,"rgba(140,80,255,.45)");g.addColorStop(1,"rgba(80,30,200,0)");x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const plasma=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));plasma.scale.set(3.6,1.6,1);plasma.position.y=.2;scene.add(plasma);
const pLight=new THREE.PointLight(0x9a5cff,0,6);pLight.position.y=.2;scene.add(pLight);
const hLight=new THREE.PointLight(0xff5a1a,0,4);hLight.position.y=-.3;scene.add(hLight);

// sparks/particles when it explodes
const N=600,pos=new Float32Array(N*3),vel=[];
for(let i=0;i<N;i++){vel.push(new THREE.Vector3());pos[i*3+1]=-99}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xb78cff,size:.04,blending:THREE.AdditiveBlending,transparent:true,opacity:.8,depthWrite:false}));scene.add(pts);
function burst(){for(let i=0;i<N;i++){pos.set([(Math.random()-.5)*2,(Math.random()-.5)*.8,(Math.random()-.5)*2],i*3);vel[i].set((Math.random()-.5),(Math.random()-.3),(Math.random()-.5)).normalize().multiplyScalar(1+Math.random()*3)}}

// lights
scene.add(new THREE.HemisphereLight(0x8aa0b8,0x0a0c10,.35));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(5,8,6);scene.add(key);
const rim=new THREE.DirectionalLight(0x7a5cff,1.4);rim.position.set(-6,3,-6);scene.add(rim);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.set(0,1.5,w<h?19:14);cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const CYCLE=12;let lastE=0,clock=new THREE.Clock(),prevBurst=-1;
let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function tick(){
  const t=reduce?4:clock.getElapsedTime(),c=(t%CYCLE)/CYCLE;
  // 0-.3 assembled + plasma, .3-.45 explode, .45-.75 hold, .75-.95 reassemble
  let e=c<.3?0:c<.45?ease((c-.3)/.15):c<.75?1:c<.95?1-ease((c-.75)/.2):0;
  const cycleN=Math.floor(t/CYCLE);if(c>=.3&&prevBurst!==cycleN&&!reduce){burst();prevBurst=cycleN}
  parts.forEach(p=>{const u=p.userData;p.position.copy(u.home).addScaledVector(u.ex,e);p.rotation.y=u.spin*e+t*.02;p.rotation.x=u.rot*e*.3});
  const on=Math.max(0,1-e*4);
  plasma.material.opacity=on*(.75+.25*Math.sin(t*20)*Math.sin(t*7));pLight.intensity=on*3;
  graphite.emissiveIntensity=on*1.4+.15;hLight.intensity=on*2;
  const dt=Math.min(.05,clock.getDelta()||.016);
  for(let i=0;i<N;i++){vel[i].multiplyScalar(.985);pos[i*3]+=vel[i].x*.016;pos[i*3+1]+=vel[i].y*.016;pos[i*3+2]+=vel[i].z*.016}
  pg.attributes.position.needsUpdate=true;pts.material.opacity=Math.max(0,.9-((c-.3)/.4))*(c>=.3?1:0);
  root.rotation.y=t*.12;
  cam.position.x+=(mx*3-cam.position.x)*.03;cam.lookAt(0,-.2+my*.5,0);
  R.render(scene,cam);requestAnimationFrame(tick);
}
tick();
// hide demo text when embedded with ?bare or #bare
if(location.hash==="#bare")document.getElementById("hero").hidden=true;
})();
</script>
